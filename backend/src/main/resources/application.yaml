spring:
  application:
    name: loyalty-backend
  profiles:
    default: dev
  autoconfigure:
    # Suppress the generated development user; real authentication belongs to P3.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: 1
      maximum-pool-size: ${DB_POOL_SIZE:10}
      schema: loyalty
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: loyalty
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: loyalty
    schemas: loyalty
    create-schemas: true
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: false
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
